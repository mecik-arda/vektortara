[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vektortara"
version = "0.1.0"
description = "Vektör veritabanları için hafif, zarar vermeyen güvenlik tarayıcısı — ChromaDB, Qdrant ve Weaviate"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Arda Meçik" }]
keywords = [
    "vector-database",
    "security",
    "scanner",
    "chromadb",
    "qdrant",
    "weaviate",
    "rag-security",
    "llm-security",
    "turkce",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]
dependencies = [
    "httpx>=0.27",
    "packaging>=23",
    "PyYAML>=6.0",
    "rich>=13.7",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/mecik-arda/vektortara"
Issues = "https://github.com/mecik-arda/vektortara/issues"

[project.scripts]
vektortara = "vektortara.cli:main"

[tool.setuptools]
packages = ["vektortara", "vektortara.vtler"]

[tool.setuptools.package-data]
vektortara = ["veriler/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["B008"]
